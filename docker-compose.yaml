services:
  onelia-postgres:
    image: postgres:18.1-bookworm
    container_name: onelia-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
  
  onelia-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: onelia-postgres-port-forwarder
    command: tcp-listen:5434,fork,reuseaddr tcp-connect:onelia-postgres:5432
    ports:
      - "127.0.0.1:5434:5434"

volumes: 
  postgres_data: